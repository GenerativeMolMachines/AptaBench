name: unimol_env

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10

  # UniMol требует numpy >= 2.0
  - numpy=2.2
  - pandas=2.2

  # PyTorch + CUDA (при необходимости GPU)
  - pytorch=2.2
  - torchvision=0.17
  - pytorch-cuda=11.8

  - pip

  - pip:
      - unimol_tools==0.1.5
      - transformers==4.40.2
      - safetensors
      - huggingface-hub