[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aptabench"
version = "1.0.0"
description = "Benchmark datasets and models for aptamer-small-molecule screening."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy==2.2.6",
    "pandas>=2.0",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "lightgbm>=3.3",
    "optuna>=3.0",
    "torch==2.6.0+cu124",
    "torchvision==0.21.0+cu124",
    "transformers>=4.30",
    "tokenizers>=0.13",
    "safetensors>=0.3",
    "huggingface-hub>=0.15",
    "datasets>=2.14",
    "rdkit==2025.9.6",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "networkx>=3.0",
    "tqdm>=4.60",
    "requests>=2.28",
    "pyyaml>=6.0",
    "python-Levenshtein>=0.20",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "ipython>=8.0",
    "notebook>=6.4",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5", "seaborn>=0.12"]
notebooks = ["jupyter", "ipykernel", "nbconvert>=6.4"]
dev = ["black", "flake8", "pytest"]
rna = ["rna-fm"]
full = [
    "unimol-tools",
    "clamp-bio",
    "mhnreact",
    "torchinfo",
    "rna-fm",
]

[tool.setuptools]
packages = ["src", "src.data", "src.encoders", "src.models", "src.viz"]
