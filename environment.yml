name: aptabench
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  # Python version
  - python=3.9

  # Core scientific libraries
  - numpy>=1.21.0
  - pandas>=2.0.0
  - scipy>=1.7.0

  # Chemistry libraries (best installed via conda)
  - rdkit>=2023.3.1

  # Machine Learning
  - scikit-learn>=1.0.0
  - lightgbm>=3.3.0

  # Deep Learning (PyTorch with CUDA support)
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - pytorch-cuda=11.8  # Change to 12.1 if needed

  # Visualization
  - matplotlib>=3.5.0
  - seaborn>=0.12.0

  # Utilities
  - tqdm>=4.60.0
  - requests>=2.28.0
  - pyyaml>=6.0

  # Jupyter
  - jupyter>=1.0.0
  - ipykernel>=6.0.0
  - ipython>=8.0.0
  - notebook>=6.4.0

  # Excel support
  - openpyxl>=3.0.0

  # Install via pip (packages not available in conda)
  - pip
  - pip:
    - transformers>=4.30.0
    - tokenizers>=0.13.0
    - safetensors>=0.3.0
    - huggingface-hub>=0.15.0
    - optuna>=3.0.0
    # Uncomment if needed:
    # - unimol-tools
    # - clamp-bio
    # - mhnreact
    # - torchinfo>=1.7.0

